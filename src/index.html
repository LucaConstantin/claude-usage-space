<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage Space</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@200;300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="starfield"></canvas>

  <!-- Red corner pulse when out of usage -->
  <div id="cornerPulse" style="display:none;">
    <div class="corner-pulse top-left"></div>
    <div class="corner-pulse top-right"></div>
    <div class="corner-pulse bottom-left"></div>
    <div class="corner-pulse bottom-right"></div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen" class="screen" style="display:none;">
    <div class="login-card">
      <div class="login-logo">&#10022;</div>
      <h1 class="login-title">Claude Usage Space</h1>
      <p class="login-subtitle">Connect your Claude account to view usage</p>

      <button id="autoDetectBtn" class="btn-primary">
        <span class="btn-icon">&rarr;</span>
        Log in with Claude
      </button>
      <p id="autoDetectError" class="error-text"></p>

      <div class="login-divider">
        <span>or paste session key</span>
      </div>

      <div class="input-group">
        <input type="password" id="sessionKeyInput" placeholder="sk-ant-..." class="input-field" />
        <button id="connectBtn" class="btn-secondary">Connect</button>
      </div>
      <p id="sessionKeyError" class="error-text"></p>
    </div>
  </div>

  <!-- Main Usage Screen -->
  <div id="mainScreen" class="screen" style="display:none;">
    <div class="usage-center">

      <div class="usage-label">CURRENT SESSION</div>

      <div class="usage-pct" id="sessionPct">&mdash;</div>

      <div class="usage-bar-wrap" id="sessionBarWrap">
        <div class="usage-bar-track">
          <div class="usage-bar-fill" id="sessionBar" style="width:0%"></div>
        </div>
      </div>

      <div class="usage-timers">
        <div class="timer-block">
          <span class="timer-caption">RESETS IN</span>
          <span class="timer-val" id="sessionCountdown">&mdash;</span>
        </div>
        <div class="timer-sep"></div>
        <div class="timer-block">
          <span class="timer-caption">AT</span>
          <span class="timer-val" id="sessionResetTime">&mdash;</span>
        </div>
      </div>

      <!-- Weekly - hidden by default -->
      <div id="weeklySection" class="weekly-section" style="display:none;">
        <div class="weekly-row">
          <span class="weekly-label">WEEKLY</span>
          <span class="weekly-pct" id="weeklyPct">&mdash;</span>
        </div>
        <div class="usage-bar-wrap small">
          <div class="usage-bar-track">
            <div class="usage-bar-fill weekly" id="weeklyBar" style="width:0%"></div>
          </div>
        </div>
        <div class="usage-timers small">
          <div class="timer-block">
            <span class="timer-caption">RESETS IN</span>
            <span class="timer-val small" id="weeklyCountdown">&mdash;</span>
          </div>
          <div class="timer-sep"></div>
          <div class="timer-block">
            <span class="timer-caption">AT</span>
            <span class="timer-val small" id="weeklyResetTime">&mdash;</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls - collapsible -->
    <div class="controls">
      <!-- Always visible: menu toggle -->
      <button id="menuToggleBtn" class="ctrl-btn menu-toggle" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"></circle>
          <circle cx="12" cy="5" r="1.5"></circle>
          <circle cx="12" cy="19" r="1.5"></circle>
        </svg>
      </button>

      <!-- Expandable buttons - ordered by importance -->
      <div id="controlsExpanded" class="controls-expanded" style="display:none;">
        <!-- Primary: View modes -->
        <div class="ctrl-group">
          <button id="moneyToggleBtn" class="ctrl-btn" title="Toggle $ view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </button>
          <button id="weeklyToggleBtn" class="ctrl-btn" title="Toggle Weekly">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <button id="fullscreenBtn" class="ctrl-btn" title="Fullscreen (F11)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>
        </div>

        <!-- Secondary: Appearance -->
        <div class="ctrl-group">
          <button id="colorBtn" class="ctrl-btn" title="Style">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
            </svg>
          </button>
          <button id="refreshBtn" class="ctrl-btn" title="Refresh">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>

        <!-- Danger zone -->
        <div class="ctrl-group">
          <button id="resetMoneyBtn" class="ctrl-btn ctrl-btn-danger" title="Reset $ counter" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button id="logoutBtn" class="ctrl-btn" title="Log out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="status-line" id="statusLine">Connecting...</div>
  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="screen">
    <div class="loading-pulse">&#10022;</div>
    <div class="loading-text">Initializing</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
