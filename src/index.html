<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage Space</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@200;300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="starfield"></canvas>
  <canvas id="planetCanvas" style="position:fixed;inset:0;z-index:1;display:none;pointer-events:none;opacity:0;"></canvas>

  <!-- Red corner pulse when out of usage -->
  <div id="cornerPulse" style="display:none;">
    <div class="corner-pulse top-left"></div>
    <div class="corner-pulse top-right"></div>
    <div class="corner-pulse bottom-left"></div>
    <div class="corner-pulse bottom-right"></div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen" class="screen" style="display:none;">
    <div class="login-card">
      <div class="login-logo">&#10022;</div>
      <h1 class="login-title">Claude Usage Space</h1>
      <p class="login-subtitle">Connect your Claude account to view usage</p>

      <button id="autoDetectBtn" class="btn-primary">
        <span class="btn-icon">&rarr;</span>
        Log in with Claude
      </button>
      <p id="autoDetectError" class="error-text"></p>

      <div class="login-divider">
        <span>or paste session key</span>
      </div>

      <div class="input-group">
        <input type="password" id="sessionKeyInput" placeholder="sk-ant-..." class="input-field" />
        <button id="connectBtn" class="btn-secondary">Connect</button>
      </div>
      <p id="sessionKeyError" class="error-text"></p>
    </div>
  </div>

  <!-- Main Usage Screen -->
  <div id="mainScreen" class="screen" style="display:none;">

    <!-- Now Playing Widget - top left -->
    <div id="musicWidget" class="now-playing">
      <img id="musicArt" class="now-playing-art" src="" alt="" />
      <div id="musicArtPlaceholder" class="now-playing-art-placeholder">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
      <div class="now-playing-info">
        <div class="now-playing-title" id="musicTitle"></div>
        <div class="now-playing-artist" id="musicArtist"></div>
      </div>
    </div>

    <div class="usage-center">

      <div class="usage-label">CURRENT SESSION</div>

      <div class="usage-pct" id="sessionPct">&mdash;</div>

      <div class="usage-bar-wrap" id="sessionBarWrap">
        <div class="usage-bar-track">
          <div class="usage-bar-fill" id="sessionBar" style="width:0%"></div>
        </div>
      </div>

      <div class="usage-timers">
        <div class="timer-block">
          <span class="timer-caption">RESETS IN</span>
          <span class="timer-val" id="sessionCountdown">&mdash;</span>
        </div>
        <div class="timer-sep"></div>
        <div class="timer-block">
          <span class="timer-caption">AT</span>
          <span class="timer-val" id="sessionResetTime">&mdash;</span>
        </div>
      </div>

      <!-- Weekly - hidden by default -->
      <div id="weeklySection" class="weekly-section" style="display:none;">
        <div class="weekly-row">
          <span class="weekly-label">WEEKLY</span>
          <span class="weekly-pct" id="weeklyPct">&mdash;</span>
        </div>
        <div class="usage-bar-wrap small">
          <div class="usage-bar-track">
            <div class="usage-bar-fill weekly" id="weeklyBar" style="width:0%"></div>
          </div>
        </div>
        <div class="usage-timers small">
          <div class="timer-block">
            <span class="timer-caption">RESETS IN</span>
            <span class="timer-val small" id="weeklyCountdown">&mdash;</span>
          </div>
          <div class="timer-sep"></div>
          <div class="timer-block">
            <span class="timer-caption">AT</span>
            <span class="timer-val small" id="weeklyResetTime">&mdash;</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls bar -->
    <div class="controls-bar" id="controlsBar">
      <button id="barToggleBtn" class="ctrl-btn bar-toggle" title="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="bar-content" id="barContent">
        <button id="refreshBtn" class="ctrl-btn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="ctrl-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
        <div class="ctrl-sep"></div>
        <button id="quitBtn" class="ctrl-btn ctrl-btn-danger" title="Quit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="status-line" id="statusLine">Connecting...</div>
  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="screen">
    <div class="loading-pulse">&#10022;</div>
    <div class="loading-text">Initializing</div>
  </div>

  <script src="planet.bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
